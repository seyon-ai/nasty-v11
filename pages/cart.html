<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Cart — NASTY Marketplace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>"/>
  <link rel="stylesheet" href="../css/global.css"/><link rel="stylesheet" href="../css/animations.css"/><link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    .cart-page{padding:7rem 0 4rem}
    .cart-layout{display:grid;grid-template-columns:1fr 380px;gap:2.5rem;align-items:start}
    .cart-item{display:grid;grid-template-columns:100px 1fr auto;gap:1.5rem;align-items:center;padding:1.5rem;background:var(--obsidian-3);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;transition:all .3s}
    .cart-item:hover{border-color:var(--border-bright)}
    .cart-item-img{width:100px;height:100px;border-radius:var(--radius-md);object-fit:cover;background:var(--obsidian-4)}
    .cart-item-title{font-family:var(--font-heading);font-size:15px;font-weight:500;color:var(--text-primary);margin-bottom:4px;cursor:pointer}
    .cart-item-title:hover{color:var(--gold-bright)}
    .cart-item-meta{font-size:12px;color:var(--text-muted);margin-bottom:12px}
    .cart-item-price{font-family:var(--font-heading);font-size:1.1rem;font-weight:700;color:var(--gold-bright)}
    .cart-item-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .qty-mini{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
    .qty-mini-btn{width:32px;height:32px;background:var(--obsidian-4);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--text-secondary);transition:all .2s}
    .qty-mini-btn:hover{background:var(--obsidian-5);color:var(--gold)}
    .qty-mini-num{width:36px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-left:1px solid var(--border);border-right:1px solid var(--border)}
    .remove-btn{font-size:12px;color:var(--text-muted);cursor:pointer;transition:color .2s;display:flex;align-items:center;gap:4px}
    .remove-btn:hover{color:var(--ember)}
    .cart-item-right{text-align:right;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
    .order-summary{background:var(--obsidian-3);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2rem;position:sticky;top:90px}
    .summary-title{font-family:var(--font-heading);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-primary);margin-bottom:1.5rem}
    .summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-secondary)}
    .summary-row:last-of-type{border-bottom:none}
    .summary-total{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;margin-top:.5rem;border-top:1px solid var(--border-bright)}
    .total-label{font-family:var(--font-heading);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .total-value{font-family:var(--font-display);font-size:1.6rem;font-weight:900;color:var(--gold-bright)}
    .promo-wrap{margin:1rem 0}
    .promo-row{display:flex;gap:8px}
    .promo-input{flex:1;padding:10px 14px;font-size:13px;border-radius:var(--radius-sm)}
    .promo-btn{padding:10px 16px;background:var(--obsidian-4);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);cursor:pointer;transition:all .2s;white-space:nowrap}
    .promo-btn:hover{border-color:var(--gold);background:var(--glass-gold)}
    .empty-cart{text-align:center;padding:6rem 2rem;grid-column:1/-1}
    .empty-icon{font-size:5rem;margin-bottom:1.5rem}
    @media(max-width:900px){.cart-layout{grid-template-columns:1fr}.order-summary{position:static}}
    @media(max-width:600px){.cart-item{grid-template-columns:80px 1fr;}.cart-item-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
  </style>
</head>
<body>
  <div class="cursor"></div><div class="cursor-ring"></div>
  <nav class="navbar scrolled">
    <div class="container navbar-inner">
      <a href="../index.html" class="navbar-logo">NASTY</a>
      <ul class="navbar-nav"><li><a href="shop.html">Shop</a></li></ul>
      <div class="navbar-actions">
        <a href="cart.html" class="nav-icon-btn" style="border-color:var(--gold)"><i class="ti ti-shopping-bag" style="color:var(--gold-bright)"></i></a>
        <button class="btn-outline" id="nav-login-btn" onclick="window.location.href='login.html'" style="padding:9px 20px;font-size:11px">Sign In</button>
        <button class="nav-icon-btn hidden" id="nav-user-btn" onclick="window.location.href='account.html'"><span id="nav-user-avatar" style="font-family:var(--font-heading);font-size:13px;font-weight:700;color:var(--gold)"></span></button>
      </div>
    </div>
  </nav>

  <div class="cart-page">
    <div class="container">
      <div style="margin-bottom:2rem">
        <div class="section-eyebrow">Your Selection</div>
        <h1 class="section-title" style="font-size:clamp(1.8rem,4vw,2.8rem)">Cart <span id="cart-count-title" style="color:var(--text-muted);font-size:.6em"></span></h1>
      </div>
      <div class="cart-layout" id="cart-layout">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { cart, showToast, formatPrice, initCursor } from '../js/core/utils.js';
    import { onAuthChange } from '../js/core/auth.js';
    initCursor();

    const PROMO_CODES = { 'NASTY20': 20, 'DRAGON10': 10, 'LOTUS15': 15 };
    let promoDiscount = 0;
    let promoApplied = '';

    function render() {
      const items = cart.get();
      const layout = document.getElementById('cart-layout');
      const countTitle = document.getElementById('cart-count-title');
      countTitle.textContent = items.length ? `(${items.length} item${items.length>1?'s':''})` : '';

      if (!items.length) {
        layout.innerHTML = `<div class="empty-cart">
          <div class="empty-icon">🛒</div>
          <h2 style="font-family:var(--font-heading);font-size:1.3rem;margin-bottom:8px">Your cart is empty</h2>
          <p style="color:var(--text-secondary);font-size:14px;margin-bottom:2rem">The dragon awaits your tribute.</p>
          <a href="shop.html" class="btn-primary"><span>⚔ Explore the Market</span></a>
        </div>`;
        return;
      }

      const subtotal = cart.total();
      const shipping = subtotal >= 50 ? 0 : 9.99;
      const discountAmt = (subtotal * promoDiscount / 100);
      const total = subtotal + shipping - discountAmt;

      layout.innerHTML = `
        <div id="cart-items">
          ${items.map(item => `
            <div class="cart-item" id="item-${item.id}">
              <img class="cart-item-img" src="${item.image}" alt="${item.title}" />
              <div>
                <div class="cart-item-title" onclick="window.location.href='product.html?id=${item.id}'">${item.title}</div>
                <div class="cart-item-meta">
                  ${item.category}
                  ${item.selectedSize ? ` · Size: <strong style="color:var(--text-primary)">${item.selectedSize}</strong>` : ''}
                </div>
                <div class="cart-item-actions">
                  <div class="qty-mini">
                    <div class="qty-mini-btn" onclick="updateQty('${item.id}',${item.qty-1})">−</div>
                    <div class="qty-mini-num">${item.qty}</div>
                    <div class="qty-mini-btn" onclick="updateQty('${item.id}',${item.qty+1})">+</div>
                  </div>
                  <span class="remove-btn" onclick="removeItem('${item.id}')"><i class="ti ti-trash"></i> Remove</span>
                </div>
              </div>
              <div class="cart-item-right">
                <div class="cart-item-price">$${(item.price * item.qty).toFixed(2)}</div>
                ${item.qty > 1 ? `<div style="font-size:11px;color:var(--text-muted)">$${item.price} each</div>` : ''}
              </div>
            </div>`).join('')}
          <div style="display:flex;gap:12px;margin-top:1rem">
            <a href="shop.html" class="btn-ghost" style="font-size:13px"><i class="ti ti-arrow-left"></i> Continue Shopping</a>
            <button class="btn-ghost" style="font-size:13px;color:var(--ember)" onclick="clearCart()"><i class="ti ti-trash"></i> Clear Cart</button>
          </div>
        </div>

        <div class="order-summary">
          <div class="summary-title">Order Summary</div>
          <div class="summary-row"><span>Subtotal (${cart.count()} items)</span><span>$${subtotal.toFixed(2)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${shipping===0?'<span style="color:var(--emerald-bright)">Free</span>':'$'+shipping.toFixed(2)}</span></div>
          ${promoDiscount ? `<div class="summary-row"><span>Promo (${promoApplied})</span><span style="color:var(--emerald-bright)">−$${discountAmt.toFixed(2)}</span></div>` : ''}
          ${shipping > 0 ? `<div style="font-size:11px;color:var(--emerald-bright);padding:6px 0">Add $${(50-subtotal).toFixed(2)} more for free shipping!</div>` : ''}

          <div class="promo-wrap">
            <div style="font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px">Promo Code</div>
            <div class="promo-row">
              <input type="text" class="form-input promo-input" id="promo-input" placeholder="NASTY20" value="${promoApplied}" ${promoApplied?'disabled':''} />
              <button class="promo-btn" onclick="${promoApplied?'removePromo()':'applyPromo()'}">${promoApplied?'Remove':'Apply'}</button>
            </div>
            <div id="promo-msg" style="font-size:11px;margin-top:6px"></div>
          </div>

          <div class="summary-total">
            <span class="total-label">Total</span>
            <span class="total-value">$${total.toFixed(2)}</span>
          </div>

          <a href="checkout.html" class="btn-primary" style="width:100%;justify-content:center;margin-top:1.5rem;display:flex">
            <span>⚔ Proceed to Checkout</span>
          </a>

          <div class="trust-badges" style="margin-top:1.5rem;justify-content:center;gap:1.5rem">
            <div class="trust-item"><i class="ti ti-lock" style="color:var(--gold)"></i><span style="font-size:11px">Secure</span></div>
            <div class="trust-item"><i class="ti ti-shield-check" style="color:var(--gold)"></i><span style="font-size:11px">Protected</span></div>
            <div class="trust-item"><i class="ti ti-refresh" style="color:var(--gold)"></i><span style="font-size:11px">30-day returns</span></div>
          </div>
        </div>`;
    }

    window.updateQty = (id, qty) => {
      if (qty < 1) { removeItem(id); return; }
      cart.updateQty(id, qty); render();
    };
    window.removeItem = (id) => {
      const item = cart.get().find(i=>i.id===id);
      const el = document.getElementById('item-'+id);
      if(el){el.style.opacity='0';el.style.transform='translateX(-20px)';el.style.transition='all .3s';}
      setTimeout(()=>{cart.remove(id);render();showToast(item?`${item.title} removed`:'Item removed','info');},300);
    };
    window.clearCart = () => { cart.clear(); render(); showToast('Cart cleared','info'); };
    window.applyPromo = () => {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      const msg = document.getElementById('promo-msg');
      if (PROMO_CODES[code]) {
        promoDiscount = PROMO_CODES[code]; promoApplied = code;
        msg.innerHTML = `<span style="color:var(--emerald-bright)">✓ ${promoDiscount}% discount applied!</span>`;
        render(); showToast(`${promoDiscount}% off applied! 🎉`, 'success');
      } else {
        msg.innerHTML = `<span style="color:var(--ember-bright)">Invalid code. Try NASTY20</span>`;
      }
    };
    window.removePromo = () => { promoDiscount=0; promoApplied=''; render(); };

    onAuthChange(user => {
      const lb=document.getElementById('nav-login-btn'); const ub=document.getElementById('nav-user-btn');
      if(user){lb.classList.add('hidden');ub.classList.remove('hidden');document.getElementById('nav-user-avatar').textContent=user.displayName?.[0]?.toUpperCase()||'👤';}
      else{lb.classList.remove('hidden');ub.classList.add('hidden');}
    });

    render();
  </script>
</body>
</html>
