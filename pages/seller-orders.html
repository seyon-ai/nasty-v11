<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orders — NASTY Seller</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>"/>
  <link rel="stylesheet" href="../css/global.css"/><link rel="stylesheet" href="../css/animations.css"/><link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    .portal-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh;padding-top:70px}
    .portal-sidebar{background:var(--obsidian-2);border-right:1px solid var(--border);padding:2rem 0;position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto}
    .sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
    .sidebar-logo-text{font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:var(--gold-bright);letter-spacing:.1em}
    .sidebar-link{display:flex;align-items:center;gap:10px;padding:.75rem 1.5rem;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .2s;border-left:2px solid transparent;text-decoration:none}
    .sidebar-link:hover{color:var(--text-primary);background:rgba(201,147,42,.04);border-left-color:var(--gold-deep)}
    .sidebar-link.active{color:var(--gold-bright);background:rgba(201,147,42,.07);border-left-color:var(--gold)}
    .portal-main{padding:2.5rem;overflow-x:hidden}
    .order-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.08em}
    .status-pending{background:rgba(201,147,42,.1);color:var(--gold-bright)}
    .status-processing{background:rgba(74,173,120,.1);color:var(--emerald-glow)}
    .status-shipped{background:rgba(96,165,250,.1);color:#60a5fa}
    .status-delivered{background:rgba(46,118,82,.1);color:var(--emerald-bright)}
    .status-cancelled{background:rgba(212,66,10,.1);color:var(--ember-bright)}
    .orders-table{width:100%;border-collapse:collapse}
    .orders-table th{font-family:var(--font-heading);font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
    .orders-table td{padding:14px;font-size:13px;color:var(--text-secondary);border-bottom:1px solid rgba(201,147,42,.06);vertical-align:middle}
    .orders-table tr:hover td{background:rgba(201,147,42,.02);color:var(--text-primary)}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
    .order-detail-panel{position:fixed;right:0;top:0;bottom:0;width:420px;background:var(--obsidian-2);border-left:1px solid var(--border-bright);z-index:500;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:2rem;overflow-y:auto;padding-top:80px}
    .order-detail-panel.open{transform:translateX(0)}
    .order-detail-panel::-webkit-scrollbar{width:2px}
    .detail-close{position:absolute;top:80px;right:1.5rem;color:var(--text-muted);cursor:pointer;font-size:1.2rem}
    .detail-section{margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
    .detail-section:last-child{border-bottom:none}
    .detail-label{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    .detail-value{font-size:13px;color:var(--text-secondary);line-height:1.6}
    .status-select{padding:7px 12px;background:var(--obsidian-3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;font-family:var(--font-body);cursor:pointer}
    .tracking-input{flex:1;padding:8px 12px;font-size:12px;border-radius:var(--radius-sm)}
    @media(max-width:900px){.portal-layout{grid-template-columns:1fr}.portal-sidebar{display:none}.order-detail-panel{width:100%}}
  </style>
</head>
<body>
  <div class="cursor"></div><div class="cursor-ring"></div>
  <nav class="navbar scrolled" style="z-index:200">
    <div class="container navbar-inner">
      <a href="../index.html" class="navbar-logo">NASTY</a>
      <div class="navbar-actions">
        <a href="shop.html" class="btn-ghost" style="font-size:12px">View Store</a>
        <button class="nav-icon-btn" onclick="window.location.href='account.html'"><span style="font-family:var(--font-heading);font-size:13px;font-weight:700;color:var(--gold)">S</span></button>
      </div>
    </div>
  </nav>

  <div class="portal-layout">
    <aside class="portal-sidebar">
      <div class="sidebar-logo"><div class="sidebar-logo-text">Seller Portal</div></div>
      <a href="seller.html" class="sidebar-link"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
      <a href="seller-products.html" class="sidebar-link"><i class="ti ti-package"></i> Products</a>
      <a href="seller-orders.html" class="sidebar-link active"><i class="ti ti-receipt"></i> Orders</a>
      <a href="seller.html" class="sidebar-link"><i class="ti ti-chart-bar"></i> Analytics</a>
      <a href="seller.html" class="sidebar-link"><i class="ti ti-robot"></i> AI Tools</a>
      <a href="seller.html" class="sidebar-link"><i class="ti ti-settings"></i> Settings</a>
    </aside>

    <main class="portal-main">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem">
        <div>
          <div style="font-family:var(--font-heading);font-size:1.4rem;font-weight:700;color:var(--text-primary)">Orders</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:4px"><span id="order-total-count">0</span> total orders</div>
        </div>
        <div style="display:flex;gap:10px">
          <div class="search-wrap" style="width:220px">
            <input type="text" class="search-input" id="order-search" placeholder="Search orders..." oninput="filterOrders(this.value)" style="padding:10px 40px 10px 16px;font-size:13px"/>
            <button class="search-btn" style="width:32px;height:32px;font-size:12px"><i class="ti ti-search"></i></button>
          </div>
          <button class="btn-outline" style="font-size:12px;padding:10px 16px" onclick="exportOrders()"><i class="ti ti-download"></i> Export</button>
        </div>
      </div>

      <!-- Status filter tabs -->
      <div class="filter-bar">
        <button class="category-chip active" onclick="filterStatus('all',this)">All Orders</button>
        <button class="category-chip" onclick="filterStatus('pending',this)">Pending <span id="count-pending" style="background:rgba(201,147,42,.2);padding:1px 6px;border-radius:100px;font-size:10px;margin-left:4px">0</span></button>
        <button class="category-chip" onclick="filterStatus('processing',this)">Processing</button>
        <button class="category-chip" onclick="filterStatus('shipped',this)">Shipped</button>
        <button class="category-chip" onclick="filterStatus('delivered',this)">Delivered</button>
        <button class="category-chip" onclick="filterStatus('cancelled',this)">Cancelled</button>
      </div>

      <div style="background:var(--obsidian-3);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Products</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-tbody"></tbody>
        </table>
        <div id="orders-empty" style="display:none;text-align:center;padding:4rem;color:var(--text-muted)">
          <div style="font-size:3rem;margin-bottom:1rem">📋</div>
          <div>No orders found</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ORDER DETAIL PANEL -->
  <div class="order-detail-panel" id="order-detail">
    <button class="detail-close" onclick="closeDetail()"><i class="ti ti-x"></i></button>
    <div id="detail-content"></div>
  </div>
  <div id="detail-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499" onclick="closeDetail()"></div>

  <div class="toast-container"></div>

  <script type="module">
    import { initCursor, showToast, formatDate } from '../js/core/utils.js';
    initCursor();

    const MOCK_ORDERS = [
      {id:'#N-001',customer:'Alex Davidson',email:'alex@example.com',phone:'+1 555 0101',items:[{title:'Obsidian Leather Jacket',qty:1,price:189,image:'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=80'}],total:189,status:'delivered',date:'Mar 15, 2025',address:'123 Dark Ave, New York, NY 10001',tracking:'1Z999AA10123456784'},
      {id:'#N-002',customer:'Mira Khan',email:'mira@example.com',phone:'+1 555 0102',items:[{title:'Gold Aura Perfume Set',qty:1,price:95,image:'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=80'}],total:95,status:'shipped',date:'Mar 14, 2025',address:'456 Lotus Lane, LA, CA 90001',tracking:''},
      {id:'#N-003',customer:'Zen Liu',email:'zen@example.com',phone:'+1 555 0103',items:[{title:'Obsidian Leather Jacket',qty:1,price:189,image:'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=80'},{title:'Ember Stone Ring',qty:2,price:340,image:'https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=80'}],total:869,status:'processing',date:'Mar 14, 2025',address:'789 Fire Road, Chicago, IL 60601',tracking:''},
      {id:'#N-004',customer:'Sam Rivera',email:'sam@example.com',phone:'+1 555 0104',items:[{title:'Lotus Aromatherapy Kit',qty:1,price:54,image:'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=80'}],total:54,status:'pending',date:'Mar 13, 2025',address:'321 Dragon St, Miami, FL 33101',tracking:''},
      {id:'#N-005',customer:'Nova Torres',email:'nova@example.com',phone:'+1 555 0105',items:[{title:'Dragon Edition Headphones',qty:1,price:249,image:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=80'},{title:'Ancient Script Notebook',qty:1,price:29,image:'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=80'}],total:278,status:'delivered',date:'Mar 12, 2025',address:'654 Shadow Blvd, Austin, TX 78701',tracking:'1Z999AA10123456785'},
      {id:'#N-006',customer:'Rex Morgan',email:'rex@example.com',phone:'+1 555 0106',items:[{title:'Void Gaming Chair',qty:1,price:520,image:'https://images.unsplash.com/photo-1598550476439-6847785fcea6?w=80'}],total:520,status:'cancelled',date:'Mar 11, 2025',address:'987 Void Ave, Seattle, WA 98101',tracking:''},
      {id:'#N-007',customer:'Iris Chen',email:'iris@example.com',phone:'+1 555 0107',items:[{title:'Mystic Desk Lamp',qty:2,price:78,image:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80'}],total:156,status:'pending',date:'Mar 10, 2025',address:'147 Ember Rd, Boston, MA 02101',tracking:''},
    ];

    let orders = [...MOCK_ORDERS];
    let filtered = [...orders];
    let activeStatus = 'all';

    document.getElementById('order-total-count').textContent = orders.length;
    document.getElementById('count-pending').textContent = orders.filter(o=>o.status==='pending').length;

    function render() {
      const tbody = document.getElementById('orders-tbody');
      const empty = document.getElementById('orders-empty');
      if (!filtered.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
      empty.style.display = 'none';
      tbody.innerHTML = filtered.map(o => `
        <tr style="cursor:pointer" onclick="openDetail('${o.id}')">
          <td style="font-family:var(--font-heading);font-weight:600;color:var(--gold-bright)">${o.id}</td>
          <td>
            <div style="font-weight:500;color:var(--text-primary)">${o.customer}</div>
            <div style="font-size:11px;color:var(--text-muted)">${o.email}</div>
          </td>
          <td>
            <div style="display:flex;gap:4px">
              ${o.items.slice(0,2).map(i=>`<img src="${i.image}" style="width:32px;height:32px;border-radius:4px;object-fit:cover" title="${i.title}" />`).join('')}
              ${o.items.length>2?`<div style="width:32px;height:32px;border-radius:4px;background:var(--obsidian-4);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted)">+${o.items.length-2}</div>`:''}
            </div>
          </td>
          <td style="font-family:var(--font-heading);font-weight:700;color:var(--gold-bright)">$${o.total.toFixed(2)}</td>
          <td><span class="order-status status-${o.status}">${o.status.charAt(0).toUpperCase()+o.status.slice(1)}</span></td>
          <td style="color:var(--text-muted)">${o.date}</td>
          <td onclick="event.stopPropagation()">
            <select class="status-select" onchange="updateStatus('${o.id}',this.value)">
              <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
              <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
              <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
              <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
              <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
            </select>
          </td>
        </tr>`).join('');
    }

    window.filterStatus = (status, btn) => {
      activeStatus = status;
      document.querySelectorAll('.filter-bar .category-chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      filtered = status==='all' ? [...orders] : orders.filter(o=>o.status===status);
      render();
    };

    window.filterOrders = (q) => {
      const base = activeStatus==='all' ? orders : orders.filter(o=>o.status===activeStatus);
      filtered = base.filter(o => o.id.toLowerCase().includes(q.toLowerCase()) || o.customer.toLowerCase().includes(q.toLowerCase()) || o.email.toLowerCase().includes(q.toLowerCase()));
      render();
    };

    window.updateStatus = (id, status) => {
      const o = orders.find(x=>x.id===id);
      if (o) { o.status = status; }
      document.getElementById('count-pending').textContent = orders.filter(o=>o.status==='pending').length;
      filterOrders(document.getElementById('order-search').value);
      showToast(`Order ${id} → ${status}`,'success');
    };

    window.openDetail = (id) => {
      const o = orders.find(x=>x.id===id);
      if (!o) return;
      document.getElementById('detail-content').innerHTML = `
        <div style="margin-bottom:1.5rem">
          <div style="font-family:var(--font-heading);font-size:1rem;font-weight:700;color:var(--text-primary);margin-bottom:4px">${o.id}</div>
          <span class="order-status status-${o.status}">${o.status.charAt(0).toUpperCase()+o.status.slice(1)}</span>
        </div>
        <div class="detail-section">
          <div class="detail-label">Customer</div>
          <div class="detail-value">
            <div style="font-weight:500;color:var(--text-primary)">${o.customer}</div>
            <div>${o.email}</div>
            <div>${o.phone}</div>
          </div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Shipping Address</div>
          <div class="detail-value">${o.address}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Items (${o.items.length})</div>
          ${o.items.map(i=>`
            <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
              <img src="${i.image}" style="width:44px;height:44px;border-radius:6px;object-fit:cover"/>
              <div style="flex:1">
                <div style="font-size:13px;color:var(--text-primary)">${i.title}</div>
                <div style="font-size:11px;color:var(--text-muted)">Qty: ${i.qty} · $${i.price}</div>
              </div>
              <div style="font-family:var(--font-heading);font-weight:700;color:var(--gold-bright)">$${(i.price*i.qty).toFixed(2)}</div>
            </div>`).join('')}
          <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);font-family:var(--font-heading);font-weight:700">
            <span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)">Total</span>
            <span style="color:var(--gold-bright)">$${o.total.toFixed(2)}</span>
          </div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Update Status</div>
          <select class="status-select" style="width:100%;padding:10px" onchange="updateStatus('${o.id}',this.value)">
            <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
            <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
            <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
            <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
          </select>
        </div>
        <div class="detail-section">
          <div class="detail-label">Tracking Number</div>
          <div style="display:flex;gap:8px">
            <input type="text" class="form-input tracking-input" id="tracking-input" placeholder="Enter tracking #" value="${o.tracking||''}"/>
            <button class="btn-outline" style="font-size:11px;padding:8px 14px;white-space:nowrap" onclick="saveTracking('${o.id}')">Save</button>
          </div>
        </div>
        <div style="padding-top:.5rem">
          <button class="btn-ghost" style="font-size:12px;color:var(--text-muted)" onclick="window.open('mailto:${o.email}')"><i class="ti ti-mail"></i> Email Customer</button>
        </div>`;
      document.getElementById('order-detail').classList.add('open');
      document.getElementById('detail-backdrop').style.display = 'block';
    };

    window.saveTracking = (id) => {
      const tracking = document.getElementById('tracking-input').value.trim();
      const o = orders.find(x=>x.id===id);
      if (o) { o.tracking = tracking; if(tracking && o.status==='processing') { o.status='shipped'; render(); } }
      showToast('Tracking saved!','success');
    };

    window.closeDetail = () => {
      document.getElementById('order-detail').classList.remove('open');
      document.getElementById('detail-backdrop').style.display = 'none';
    };

    window.exportOrders = () => {
      const csv = ['ID,Customer,Email,Total,Status,Date'].concat(
        orders.map(o=>`${o.id},"${o.customer}",${o.email},$${o.total},${o.status},${o.date}`)
      ).join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nasty-orders.csv'; a.click();
      showToast('Orders exported!','success');
    };

    render();
  </script>
</body>
</html>
